[project]
name = "song-genre-identification"
version = "0.1.0"
description = "Weakly supervised lyric-based genre classification with Last.fm enrichment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "jupyter>=1.1",
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
